<div class="responsive-cropper-container" data-bind="visible: statesList().length > 0">
    <div class="compression-overlay" data-bind="visible: busyText()">
        <div class="compression-progress-container" role="status">
            <span class="spinner"></span>
            <span class="compression-message" data-bind="text: busyText()"></span>
        </div>
    </div>

    <div class="breakpoint-tabs">
        <ul class="tabs-navigation" data-bind="foreach: tabs">
            <li data-bind="css: {active: active}, click: $parent.selectTab.bind($parent)">
                <span class="tab-title" data-bind="text: name"></span>
                <span class="tab-dimension" data-bind="text: sizeText"></span>
                <!-- ko if: changed -->
                <span class="tab-changed" role="img"
                      data-bind="attr: {title: $t('Changed'), 'aria-label': $t('Changed')}"></span>
                <!-- /ko -->
            </li>
        </ul>
    </div>

    <!-- ko if: panel() -->
    <div class="breakpoint-content">
        <div class="breakpoint-info">
            <span class="label" data-bind="i18n: 'Target Size:'"></span>
            <span class="value" data-bind="text: panel().sizeText"></span>
            <span class="separator">|</span>
            <span class="label" data-bind="i18n: 'Media Query:'"></span>
            <span class="value media-query" data-bind="text: panel().mediaQuery"></span>
        </div>

        <!-- ko if: panel().remove -->
        <div class="crop-removal-notice message message-warning">
            <span data-bind="i18n: 'This crop will be deleted when you save the banner.'"></span>
            <button type="button" class="action-secondary" data-bind="click: function () { setRemoved(false); }">
                <span data-bind="i18n: 'Keep the Crop'"></span>
            </button>
        </div>
        <!-- /ko -->

        <!-- ko ifnot: panel().remove -->
        <div class="image-source-section">
            <div class="image-source-section-header">
                <h4 data-bind="i18n: 'Image Source'"></h4>
                <div class="current-source-indicator">
                    <!-- ko if: panel().usesOwnImage -->
                    <span class="source-badge custom-source"><span data-bind="i18n: 'Own Image'"></span></span>
                    <!-- /ko -->
                    <!-- ko ifnot: panel().usesOwnImage -->
                    <span class="source-badge desktop-source"><span data-bind="i18n: 'Banner Image'"></span></span>
                    <!-- /ko -->
                </div>
            </div>
            <div class="image-source-controls">
                <div class="image-source-actions">
                    <label class="action-secondary file-picker">
                        <!-- ko if: panel().usesOwnImage -->
                        <span data-bind="i18n: 'Replace Own Image'"></span>
                        <!-- /ko -->
                        <!-- ko ifnot: panel().usesOwnImage -->
                        <span data-bind="i18n: 'Upload Own Image'"></span>
                        <!-- /ko -->
                        <input type="file" class="file-picker-input"
                               data-bind="attr: {accept: allowedImageTypes.join(',')},
                                          event: {change: uploadOwnImage}"/>
                    </label>
                    <!-- ko if: panel().usesOwnImage -->
                    <button type="button" class="action-tertiary" data-bind="click: useBannerImage">
                        <span data-bind="i18n: 'Use Banner Image'"></span>
                    </button>
                    <!-- /ko -->
                </div>
            </div>
            <p class="image-source-hint"
               data-bind="i18n: 'Crop the banner image, or upload an image of its own for this breakpoint.'"></p>
        </div>

        <!-- ko ifnot: panel().hasSource -->
        <div class="no-source-image-message">
            <p data-bind="i18n: 'Upload the banner image above, or an image of its own for this breakpoint.'"></p>
        </div>
        <!-- /ko -->

        <!-- ko if: activeSourceUrl() -->
        <div class="cropper-area">
            <h4 data-bind="i18n: 'Crop Area'"></h4>
            <div class="cropper-wrapper">
                <img data-bind="attr: {src: activeSourceUrl, alt: $t('Source image of the crop')},
                                event: {load: attachCropper}"/>
            </div>
        </div>
        <!-- /ko -->

        <!-- ko if: panel().hasSource -->
        <div class="quality-settings">
            <h4 data-bind="i18n: 'Image Formats'"></h4>
            <p class="format-fallback" data-bind="text: panel().fallbackText"></p>
            <!-- ko foreach: formatRows -->
            <div class="format-option">
                <label>
                    <input type="checkbox" data-bind="checked: selected, disable: disabled"/>
                    <span data-bind="text: label"></span>
                </label>
                <!-- ko if: note -->
                <span class="format-note" data-bind="text: note"></span>
                <!-- /ko -->
                <div class="quality-slider" data-bind="visible: selected">
                    <span class="quality-label" data-bind="i18n: 'Quality'"></span>
                    <input type="range" min="1" max="100"
                           data-bind="value: quality, valueUpdate: 'input', attr: {'aria-label': $t('Quality')}"/>
                    <input type="number" min="1" max="100" class="quality-input"
                           data-bind="value: quality, valueUpdate: 'input', attr: {'aria-label': $t('Quality')}"/>
                </div>
            </div>
            <!-- /ko -->
        </div>

        <label class="crop-enabled">
            <input type="checkbox" data-bind="checked: panel().enabled, event: {change: toggleEnabled}"/>
            <span data-bind="i18n: 'Show this crop on the storefront'"></span>
        </label>
        <!-- /ko -->

        <!-- ko if: comparison() -->
        <div class="image-comparison-section">
            <h4 data-bind="i18n: 'Quality Comparison'"></h4>
            <!-- ko ifnot: comparison().fromPreview -->
            <p class="comparison-hint"
               data-bind="i18n: 'These are the saved images. Use Preview to compare the current settings.'"></p>
            <!-- /ko -->
            <div class="comparison-tabs" data-bind="foreach: comparison().items">
                <button type="button" class="comparison-tab"
                        data-bind="css: {active: active}, click: function () { $parent.comparisonCode(code); }">
                    <span data-bind="text: label"></span>
                </button>
            </div>
            <div class="image-comparison-wrapper">
                <img-comparison-slider value="50">
                    <img slot="first"
                         data-bind="attr: {src: comparison().current.url, alt: comparison().current.label}"/>
                    <img slot="second" data-bind="attr: {src: comparison().originalUrl, alt: $t('Fallback image')}"/>
                </img-comparison-slider>
            </div>
            <div class="comparison-labels">
                <span class="label-left" data-bind="text: comparison().current.label"></span>
                <span class="label-right" data-bind="i18n: 'Fallback image'"></span>
            </div>
            <!-- ko if: comparison().originalSizeText -->
            <div class="comparison-sizes">
                <div class="size-info">
                    <div class="size-item original">
                        <span class="size-label" data-bind="i18n: 'Fallback image'"></span>
                        <span class="size-value" data-bind="text: comparison().originalSizeText"></span>
                    </div>
                    <!-- ko foreach: comparison().items -->
                    <div class="size-item optimized">
                        <span class="size-label" data-bind="text: label"></span>
                        <span class="size-value" data-bind="text: sizeText"></span>
                        <span class="size-savings" data-bind="text: savingsText, css: {'size-larger': larger}"></span>
                    </div>
                    <!-- /ko -->
                </div>
            </div>
            <!-- /ko -->
            <p class="comparison-hint" data-bind="i18n: 'Drag the slider to compare image quality.'"></p>
        </div>
        <!-- /ko -->

        <div class="crop-actions">
            <!-- ko if: panel().hasSource -->
            <button type="button" class="action-secondary" data-bind="click: previewActive, disable: busyText()">
                <span data-bind="i18n: 'Preview'"></span>
            </button>
            <!-- /ko -->
            <!-- ko if: panel().canRemove -->
            <button type="button" class="action-tertiary" data-bind="click: function () { setRemoved(true); }">
                <span data-bind="i18n: 'Delete Crop'"></span>
            </button>
            <!-- /ko -->
            <p class="crop-save-hint"
               data-bind="i18n: 'Crops are saved with the banner. Images this browser cannot prepare are generated on the server.'"></p>
        </div>
        <!-- /ko -->
    </div>
    <!-- /ko -->
</div>

<div class="no-breakpoints-message" data-bind="visible: statesList().length === 0">
    <p data-bind="i18n: 'Choose a slider with enabled breakpoints to crop the banner image for each of them.'"></p>
</div>
